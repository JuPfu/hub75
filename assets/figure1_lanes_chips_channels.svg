<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">From the HUB75 connector to the LEDs</title>
<desc id="d">The HUB75 connector has six data pins. Each pin feeds one lane, a chain of 8 ICND2153 chips. Each chip has 16 output channels, OUT15 to OUT0, and each output channel drives one LED.</desc>
