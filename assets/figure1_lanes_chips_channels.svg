<circle cx="180" cy="353" r="6" fill="#2f6fd0"/>
<text x="105" y="376" text-anchor="middle" font-size="12" fill="#57606a">each data pin carries</text>
<text x="105" y="391" text-anchor="middle" font-size="12" fill="#57606a">1 bit per clock tick</text>
<text x="480" y="100" text-anchor="middle" font-size="14" fill="#1f2328">8 chips per lane (128 columns ÷ 16 LEDs per chip)</text>
