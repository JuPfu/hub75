<text x="125" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#d6453d">R1</text>
<circle cx="180" cy="125" r="6" fill="#d6453d"/>
<text x="125" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#2e9e5b">G1</text>
<circle cx="180" cy="167" r="6" fill="#2e9e5b"/>
<text x="125" y="214" text-anchor="middle" font-size="15" font-weight="600" fill="#2f6fd0">B1</text>
<circle cx="180" cy="209" r="6" fill="#2f6fd0"/>
