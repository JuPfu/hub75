<text x="607.0" y="296" text-anchor="middle" font-size="14" fill="#57606a">···   rounds 3 to 15 follow the same pattern   ···</text>
<rect x="30" y="391" width="940" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="50" y="417" font-size="14" fill="#1f2328"><tspan font-weight="600">pixel = (chip − 1) × 16 + (round − 1)</tspan><tspan fill="#57606a">    and    </tspan><tspan font-weight="600">output channel = OUT(16 − round)</tspan></text>
<text x="50" y="440" font-size="13" fill="#57606a">Each chip receives only one of its 16 pixels per round. All six lanes use the same pixel positions at the same time.</text>
</svg>
