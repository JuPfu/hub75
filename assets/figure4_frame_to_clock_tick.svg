<title id="t">From frame to clock tick</title>
<desc id="d">A frame consists of 32 row pairs and 65,536 clock ticks. One row pair has 16 rounds and 2,048 clock ticks. One round serves 8 chips with 128 clock ticks. One chip receives 16 bits in 16 clock ticks.</desc>
