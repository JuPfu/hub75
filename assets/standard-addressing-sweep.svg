<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One address's row written as an interleaved R0G0B0/R1G1B1 word per column (ROW_MAP_STANDARD)</title>
<desc>A single continuous left-to-right sweep across the panel width, with one column's shift-register word zoomed in below to show that R0, G0, B0 for the top row and R1, G1, B1 for the paired row are shifted out together as one six-value word per clock.</desc>
<style>
  .bg { fill: #ffffff; }
  .container { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; }
  .bar-a { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
  .bar-b { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .chip-a { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
  .chip-b { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .highlight { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
  .title { fill: #2C2C2A; font: 500 14px sans-serif; }
  .label-a { fill: #04342C; font: 400 12px sans-serif; }
  .label-b { fill: #26215C; font: 400 12px sans-serif; }
  .sub { fill: #5F5E5A; font: 400 12px sans-serif; }
  .caption { fill: #5F5E5A; font: 400 12px sans-serif; }
  .arrowline { stroke: #5F5E5A; stroke-width: 1; fill: none; }
  .leaderline { stroke: #5F5E5A; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1e1e1e; }
    .container { stroke: #B4B2A9; }
    .bar-a, .chip-a { fill: #085041; stroke: #5DCAA5; }
    .bar-b, .chip-b { fill: #3C3489; stroke: #AFA9EC; }
    .highlight { stroke: #D3D1C7; }
    .title { fill: #F1EFE8; }
    .label-a { fill: #9FE1CB; }
    .label-b { fill: #CECBF6; }
    .sub { fill: #D3D1C7; }
    .caption { fill: #D3D1C7; }
    .arrowline { stroke: #D3D1C7; }
    .leaderline { stroke: #D3D1C7; }
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="420"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" class="arrowline"/>
  </marker>
</defs>

<text class="sub" x="340" y="18" text-anchor="middle">Single left-to-right sweep, columns 0-63, no splitting</text>
<line class="arrowline" x1="80" y1="30" x2="600" y2="30" marker-end="url(#arrow)"/>

<g>
<rect class="container" x="60" y="45" width="560" height="140" rx="10"/>
<text class="title" x="340" y="65" text-anchor="middle">Address 0</text>
<rect class="bar-a" x="80" y="80" width="520" height="34" rx="6"/>
<text class="label-a" x="340" y="97" text-anchor="middle" dominant-baseline="central">Row 0 — columns 0 through 63</text>
<rect class="bar-b" x="80" y="128" width="520" height="34" rx="6"/>
<text class="label-b" x="340" y="145" text-anchor="middle" dominant-baseline="central">Row 16 — columns 0 through 63</text>
<rect class="highlight" x="300" y="80" width="24" height="82" rx="3"/>
</g>

<line class="leaderline" x1="312" y1="185" x2="312" y2="222"/>
<circle cx="312" cy="185" r="2.5" fill="#5F5E5A" class="leaderline"/>
<text class="sub" x="322" y="207" text-anchor="start">this column, zoomed below</text>

<g>
<rect class="container" x="140" y="225" width="400" height="140" rx="10"/>
<text class="title" x="340" y="245" text-anchor="middle">One column, one CLK pulse</text>
<line class="arrowline" x1="155" y1="258" x2="525" y2="258" marker-end="url(#arrow)"/>

<rect class="chip-a" x="152" y="268" width="56" height="40" rx="6"/><text class="label-a" x="180" y="288" text-anchor="middle" dominant-baseline="central">R0</text>
<rect class="chip-a" x="216" y="268" width="56" height="40" rx="6"/><text class="label-a" x="244" y="288" text-anchor="middle" dominant-baseline="central">G0</text>
<rect class="chip-a" x="280" y="268" width="56" height="40" rx="6"/><text class="label-a" x="308" y="288" text-anchor="middle" dominant-baseline="central">B0</text>
<rect class="chip-b" x="344" y="268" width="56" height="40" rx="6"/><text class="label-b" x="372" y="288" text-anchor="middle" dominant-baseline="central">R1</text>
<rect class="chip-b" x="408" y="268" width="56" height="40" rx="6"/><text class="label-b" x="436" y="288" text-anchor="middle" dominant-baseline="central">G1</text>
<rect class="chip-b" x="472" y="268" width="56" height="40" rx="6"/><text class="label-b" x="500" y="288" text-anchor="middle" dominant-baseline="central">B1</text>

<text class="sub" x="340" y="328" text-anchor="middle">pins: DATA_BASE_PIN .. DATA_BASE_PIN+5</text>
</g>

<text class="caption" x="340" y="385" text-anchor="middle">R0G0B0 (row 0) and R1G1B1 (row 16) interleave into</text>
<text class="caption" x="340" y="400" text-anchor="middle">one 6-value word per column — repeated across the sweep</text>
</svg>
