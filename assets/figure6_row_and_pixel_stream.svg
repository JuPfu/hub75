<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How the data program and the scan program work together</title>
<desc id="d">Sequence diagram with four participants: the driver (DMA), the scan program icnd2153_row, the data program icnd2153_pixel_stream and the ICND2153 chips. Step 1: the scan program refreshes the panel continuously. Step 2: when a frame is complete, the driver starts the next transfer and leaves a frame-start note. Step 3: handshake with start now, VSYNC and VSYNC done. Step 4: the new frame is transferred while the scan program keeps refreshing, in parallel. Step 5: the frame is sent and the cycle starts again at step 2.</desc>
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4fc1"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b36b00"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fd0"/></marker></defs>
<rect x="1" y="1" width="998" height="698" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="34" text-anchor="start" font-size="17" font-weight="600" fill="#1f2328">Scan program and data program: one frame cycle</text>
<rect x="20" y="128" width="960" height="94" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="20" y="232" width="960" height="86" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="328" width="960" height="146" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="20" y="484" width="960" height="156" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="650" width="960" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<line x1="150" y1="112" x2="150" y2="686" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="380" y1="112" x2="380" y2="686" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="610" y1="112" x2="610" y2="686" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="850" y1="112" x2="850" y2="686" stroke="#57606a" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="28.0" y="133.0" width="253.0" height="18.0" rx="3" fill="#f6f8fa"/>
<text x="32" y="146" text-anchor="start" font-size="13" font-weight="600" fill="#1f2328">1. The panel is refreshed continuously</text>
<rect x="28.0" y="237.0" width="383.0" height="18.0" rx="3" fill="#ffffff"/>
<text x="32" y="250" text-anchor="start" font-size="13" font-weight="600" fill="#1f2328">2. The previous frame is complete, the next one is started</text>
<rect x="28.0" y="333.0" width="331.0" height="18.0" rx="3" fill="#f6f8fa"/>
<text x="32" y="346" text-anchor="start" font-size="13" font-weight="600" fill="#1f2328">3. Handshake (the only time the two programs talk)</text>
<rect x="28.0" y="489.0" width="305.0" height="18.0" rx="3" fill="#ffffff"/>
<text x="32" y="502" text-anchor="start" font-size="13" font-weight="600" fill="#1f2328">4. From here on both programs work in parallel</text>
<rect x="362" y="154" width="518" height="62" rx="5" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="366.0" y="156.5" width="201.5" height="16.5" rx="3" fill="#f6f8fa"/>
<text x="370" y="168" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">loop: all 32 rows, again and again</text>
<line x1="380" y1="188" x2="848" y2="188" stroke="#b36b00" stroke-width="2" marker-end="url(#aa)"/>
<rect x="664.5" y="168.5" width="131.0" height="17.5" rx="3" fill="#f6f8fa"/>
<text x="730" y="181" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">burst of GCLK pulses</text>
<line x1="380" y1="208" x2="848" y2="208" stroke="#b36b00" stroke-width="2" marker-end="url(#aa)"/>
<rect x="655.1" y="188.5" width="149.8" height="17.5" rx="3" fill="#f6f8fa"/>
<text x="730" y="201" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">move on to the next row</text>
<line x1="150" y1="278" x2="608" y2="278" stroke="#7a4fc1" stroke-width="2" marker-end="url(#ap)"/>
<rect x="385.8" y="258.5" width="218.5" height="17.5" rx="3" fill="#ffffff"/>
<text x="495" y="271" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">start sending the next frame (DMA)</text>
<line x1="150" y1="304" x2="378" y2="304" stroke="#7a4fc1" stroke-width="2" marker-end="url(#ap)"/>
<rect x="174.5" y="284.5" width="181.0" height="17.5" rx="3" fill="#ffffff"/>
<text x="265" y="297" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">&quot;frame start&quot; note</text>
<line x1="380" y1="376" x2="608" y2="376" stroke="#b36b00" stroke-width="2" marker-end="url(#aa)"/>
<rect x="426.4" y="356.5" width="137.2" height="17.5" rx="3" fill="#f6f8fa"/>
<text x="495" y="369" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">&quot;start now&quot;</text>
<line x1="610" y1="404" x2="848" y2="404" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ab)"/>
<rect x="639.5" y="384.5" width="181.0" height="17.5" rx="3" fill="#f6f8fa"/>
<text x="730" y="397" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">VSYNC (3 short latch pulses)</text>
<line x1="610" y1="432" x2="382" y2="432" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ab)"/>
<rect x="423.2" y="412.5" width="143.5" height="17.5" rx="3" fill="#f6f8fa"/>
<text x="495" y="425" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">&quot;VSYNC done&quot;</text>
<rect x="300" y="442" width="160" height="24" rx="5" fill="#fff0d6" stroke="#b36b00" stroke-width="1.3"/>
<text x="380" y="458" text-anchor="middle" font-size="12.5" fill="#1f2328">restart at row 0</text>
<rect x="140" y="510" width="740" height="122" rx="5" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="156.0" y="515.0" width="186.0" height="17.0" rx="3" fill="#ffffff"/>
<text x="160" y="527" text-anchor="start" font-size="12" font-weight="600" fill="#1f2328">par: transfer of the new frame</text>
<rect x="156.0" y="531.5" width="178.5" height="16.5" rx="3" fill="#ffffff"/>
<text x="160" y="543" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">loop: 32 row pairs × 16 rounds</text>
<line x1="610" y1="558" x2="848" y2="558" stroke="#2f6fd0" stroke-width="2" marker-end="url(#ab)"/>
<rect x="598.9" y="538.5" width="262.2" height="17.5" rx="3" fill="#ffffff"/>
<text x="730" y="551" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">128 clock ticks of pixel data, then latch</text>
<line x1="140" y1="574" x2="880" y2="574" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3"/>
<rect x="156.0" y="579.0" width="144.0" height="17.0" rx="3" fill="#ffffff"/>
<text x="160" y="591" text-anchor="start" font-size="12" font-weight="600" fill="#1f2328">and: continuous refresh</text>
<rect x="156.0" y="595.5" width="201.5" height="16.5" rx="3" fill="#ffffff"/>
<text x="160" y="607" text-anchor="start" font-size="11.5" font-weight="400" fill="#57606a">loop: all 32 rows, dozens of times</text>
<line x1="380" y1="620" x2="848" y2="620" stroke="#b36b00" stroke-width="2" marker-end="url(#aa)"/>
<rect x="655.1" y="600.5" width="149.8" height="17.5" rx="3" fill="#ffffff"/>
<text x="730" y="613" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2328">GCLK burst and next row</text>
<rect x="150" y="656" width="460" height="28" rx="5" fill="#e8def7" stroke="#7a4fc1" stroke-width="1.3"/>
<text x="380.0" y="675" text-anchor="middle" font-size="12.5" fill="#1f2328">frame sent: the driver starts the next frame (back to step 2)</text>
<rect x="55" y="56" width="190" height="56" rx="8" fill="#e8def7" stroke="#7a4fc1" stroke-width="1.8"/>
<text x="150" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Driver (DMA)</text>
<rect x="285" y="56" width="190" height="56" rx="8" fill="#fff0d6" stroke="#b36b00" stroke-width="1.8"/>
<text x="380" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Scan program</text>
<text x="380" y="100" text-anchor="middle" font-size="11.5" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">icnd2153_row</text>
<rect x="515" y="56" width="190" height="56" rx="8" fill="#dce8fa" stroke="#2f6fd0" stroke-width="1.8"/>
<text x="610" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Data program</text>
<text x="610" y="100" text-anchor="middle" font-size="11.5" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">icnd2153_pixel_stream</text>
<rect x="755" y="56" width="190" height="56" rx="8" fill="#dff3e6" stroke="#2e9e5b" stroke-width="1.8"/>
<text x="850" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">ICND2153 chips</text>
</svg>
